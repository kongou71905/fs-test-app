<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀成績管理ツール</title>
    <!-- Tailwind CSSを読み込んでいます -->
    <script src="https://tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between items-center py-16 px-4">

    <!-- タイトルエリア -->
    <header class="w-full text-center max-w-md pt-8">
        <h1 class="text-xl font-bold tracking-wider text-gray-800">
            麻雀成績管理ツール
        </h1>
    </header>

    <!-- ボタンメニューエリア（gap-12 で正確に48pxの隙間を空けました） -->
    <main class="w-full max-w-xs flex flex-col gap-12 my-auto">
        <button onclick="handleNavigation('management')" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-4 px-6 rounded-sm shadow-sm transition-colors duration-200 tracking-widest text-center">
            管理
        </button>

        <button onclick="handleNavigation('data')" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-4 px-6 rounded-sm shadow-sm transition-colors duration-200 tracking-widest text-center">
            データ
        </button>

        <button onclick="handleNavigation('input')" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-4 px-6 rounded-sm shadow-sm transition-colors duration-200 tracking-widest text-center">
            入力
        </button>
    </main>

    <!-- フッター（バージョン・日付）エリア -->
    <footer class="w-full text-center max-w-md text-sm text-gray-600 tracking-wide pb-4 flex justify-center gap-4">
        <span>2026/11/06</span>
        <span>ver1.0.0</span>
    </footer>

    <!-- 各ボタンを押したときの動きを制御するJavaScript -->
    <script>
        function handleNavigation(page) {
            switch(page) {
                case 'management':
                    alert('管理画面へ移動します（実装待ち）');
                    break;
                case 'data':
                    alert('データ画面へ移動します（実装待ち）');
                    break;
                case 'input':
                    alert('入力画面へ移動します（実装待ち）');
                    break;
            }
        }
    </script>
</body>
</html>
