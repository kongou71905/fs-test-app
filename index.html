<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀成績管理ツール</title>
    <!-- Tailwind CSSを読み込んでいます -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }
        .screen-hidden {
            display: none !important;
        }
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen m-0 p-0">

    <!-- ========================================== -->
    <!-- 1. モード選択画面（トップ画面） -->
    <!-- ========================================== -->
    <div id="menuScreen" class="w-full min-h-screen flex flex-col justify-between items-center py-16 px-4">
        <header class="w-full text-center max-w-md pt-8">
            <h1 class="text-xl font-bold tracking-wider text-gray-800">
                麻雀成績管理ツール
            </h1>
        </header>

        <main class="w-full max-w-xs flex flex-col gap-12 my-auto">
            <button onclick="showScreen('management')" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-4 px-6 rounded-sm shadow-sm transition-colors duration-200 tracking-widest text-center">
                管理
            </button>
            <button onclick="showScreen('data')" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-4 px-6 rounded-sm shadow-sm transition-colors duration-200 tracking-widest text-center">
                データ
            </button>
            <button onclick="showScreen('input')" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-4 px-6 rounded-sm shadow-sm transition-colors duration-200 tracking-widest text-center">
                入力
            </button>
        </main>

        <footer class="w-full text-center max-w-md text-sm text-gray-600 tracking-wide flex justify-center gap-4">
            <span>2026/11/09</span>
            <span>ver0.0.9</span>
        </footer>
    </div>


    <!-- ========================================== -->
    <!-- 2. 対局者管理画面 -->
    <!-- ========================================== -->
    <div id="managementScreen" class="screen-hidden">
        <div class="w-full max-w-md flex-grow">
            <header class="mb-10 text-center">
                <h2 class="text-xl font-bold tracking-wider text-gray-800">対局者管理画面</h2>
            </header>

            <div class="grid grid-cols-12 gap-2 mb-4 text-gray-700 font-medium max-w-xs mx-auto md:max-w-md">
                <div class="col-span-2 pl-2">ID</div>
                <div class="col-span-6">対局者名</div>
                <div class="col-span-4"></div>
            </div>

            <div id="playerList" class="flex flex-col gap-4 max-w-xs mx-auto md:max-w-md"></div>
        </div>

        <footer class="w-full max-w-md flex flex-col items-center gap-12 mt-auto">
            <div class="flex justify-between gap-8 w-full max-w-xs mx-auto md:max-w-md">
                <button onclick="addPlayer()" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">
                    追加
                </button>
                <button onclick="showScreen('menu')" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">
                    戻る
                </button>
            </div>
            <div class="text-center text-sm text-gray-600 tracking-wide flex justify-center gap-4">
                <span>2026/11/09</span>
                <span>ver0.0.9</span>
            </div>
        </footer>
    </div>


    <!-- ========================================== -->
    <!-- 3. 過去データ画面 -->
    <!-- ========================================== -->
    <div id="dataScreen" class="screen-hidden">
        <div class="w-full max-w-2xl flex-grow px-2">
            <div class="text-left w-full mb-4 pl-2 font-medium text-gray-800">2026年</div>

            <div class="table-container border border-gray-400 bg-white">
                <table class="w-full text-center border-collapse text-sm md:text-base">
                    <thead>
                        <tr class="border-b border-gray-400">
                            <th class="border-r border-gray-400 p-2 font-medium bg-gray-50 min-w-[100px]">対局者</th>
                            <th id="th-p1" class="border-r border-gray-400 p-2 font-medium min-w-[70px]">氏名</th>
                            <th id="th-p2" class="border-r border-gray-400 p-2 font-medium min-w-[70px]">氏名</th>
                            <th id="th-p3" class="border-r border-gray-400 p-2 font-medium min-w-[70px]">氏名</th>
                            <th id="th-p4" class="border-gray-400 p-2 font-medium min-w-[70px]">氏名</th>
                        </tr>
                        <tr class="border-b border-gray-400 bg-gray-50">
                            <td class="border-r border-gray-400 p-2 font-medium">成績</td>
                            <td class="border-r border-gray-400 p-2 font-bold text-red-500">-123</td>
                            <td class="border-r border-gray-400 p-2 font-bold text-gray-900">+57</td>
                            <td class="border-r border-gray-400 p-2 font-bold text-gray-900">+66</td>
                            <td class="p-2 font-bold text-gray-900">0</td>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </div>

        <footer class="w-full max-w-md flex flex-col items-center gap-12 mt-12">
            <div class="flex justify-between gap-8 w-full max-w-xs mx-auto md:max-w-md">
                <button onclick="alert('期間選択機能は実装待ちです')" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">
                    期間
                </button>
                <button onclick="showScreen('menu')" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">
                    戻る
                </button>
            </div>
            <div class="text-center text-sm text-gray-600 tracking-wide flex justify-center gap-4">
                <span>2026/11/09</span>
                <span>ver0.0.9</span>
            </div>
        </footer>
    </div>


    <!-- ========================================== -->
    <!-- 4. 日付対局者設定画面（新規追加） -->
    <!-- ========================================== -->
    <div id="inputScreen" class="screen-hidden">
        <div class="w-full max-w-md flex-grow">
            <!-- 画面タイトル -->
            <header class="mb-6 text-left">
                <h2 class="text-xl font-bold tracking-wider text-gray-800">日付対局者設定画面</h2>
            </header>

            <!-- 日付入力欄 (画像デザインを再現したグレーの背景) -->
            <div class="mb-10 text-left">
                <input 
                    type="text" 
                    value="2026/11/09" 
                    class="bg-gray-300 text-gray-800 font-medium py-2 px-4 rounded-sm text-center tracking-wider max-w-[180px] focus:outline-none"
                    placeholder="yyyy/mm/dd"
                >
            </div>

            <!-- 対局者名リスト (2列のチェックボックス形式) -->
            <div id="selectorPlayerList" class="grid grid-cols-2 gap-x-8 gap-y-6 max-w-xs mx-auto md:max-w-md pl-2">
                <!-- JavaScriptで動的にチェックボックス行を生成 -->
            </div>
        </div>

        <!-- 下部アクションボタンエリア (右寄りの配置) -->
        <footer class="w-full max-w-md flex flex-col items-center gap-12 mt-auto">
            <div class="flex justify-end w-full max-w-xs mx-auto md:max-w-md">
                <button onclick="handleInputOk()" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">
                    OK
                </button>
            </div>
            
            <div class="text-center text-sm text-gray-600 tracking-wide flex justify-center gap-4">
                <span>2026/11/09</span>
                <span>ver0.0.9</span>
            </div>
        </footer>
    </div>


    <!-- ========================================== -->
    <!-- ロジック制御（JavaScript） -->
    <!-- ========================================== -->
    <script>
        const defaultPlayers = [
            { id: 1, name: 'プレイヤー1' },
            { id: 2, name: 'プレイヤー2' },
            { id: 3, name: 'プレイヤー3' },
            { id: 4, name: 'プレイヤー4' }
        ];

        const sampleScores = [
            { date: '2026/11/01', scores: ['0', '-123', '+57', '+66'] },
            { date: '2026/11/02', scores: ['+66', '0', '-123', '+57'] },
            { date: '2026/11/03', scores: ['+57', '+66', '0', '-123'] },
            { date: '2026/11/04', scores: ['-123', '+57', '+66', '0'] },
            { date: '2026/11/05', scores: ['0', '-123', '+57', '+66'] },
            { date: '2026/11/06', scores: ['+66', '0', '-123', '+57'] },
            { date: '2026/11/06', scores: ['+57', '+66', '0', '-123'] }
        ];

        let players = JSON.parse(localStorage.getItem('mahjong_players')) || defaultPlayers;

        function showScreen(screenName) {
            const menu = document.getElementById('menuScreen');
            const management = document.getElementById('managementScreen');
            const dataScreen = document.getElementById('dataScreen');
            const inputScreen = document.getElementById('inputScreen');

            // 全て一旦非表示
            menu.className = "screen-hidden";
            management.className = "screen-hidden";
            dataScreen.className = "screen-hidden";
            inputScreen.className = "screen-hidden";

            if (screenName === 'management') {
                management.className = "w-full min-h-screen flex flex-col justify-between items-center py-16 px-4";
                renderPlayers();
            } else if (screenName === 'menu') {
                menu.className = "w-full min-h-screen flex flex-col justify-between items-center py-16 px-4";
            } else if (screenName === 'data') {
                dataScreen.className = "w-full min-h-screen flex flex-col justify-between items-center py-16 px-4";
                renderDataScreen();
            } else if (screenName === 'input') {
                inputScreen.className = "w-full min-h-screen flex flex-col justify-between items-center py-16 px-4";
                renderInputScreen();
            }
            window.scrollTo(0, 0);
        }

        // 対局者管理のレンダリング
        function renderPlayers() {
            const listContainer = document.getElementById('playerList');
            listContainer.innerHTML = '';

            players.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-12 gap-2 items-center';
                row.innerHTML = `
                    <div class="col-span-2 pl-2 text-gray-700 font-medium">${index + 1}</div>
                    <div class="col-span-6">
                        <input 
                            type="text" 
                            value="${player.name}" 
                            onchange="updatePlayerName(${player.id}, this.value)"
                            class="w-full bg-green-50 border border-transparent focus:border-green-300 focus:bg-white focus:outline-none px-3 py-2 text-gray-800 rounded-sm"
                            placeholder="名前を入力"
                        >
                    </div>
                    <div class="col-span-4 text-right">
                        <button onclick="deletePlayer(${player.id})" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-4 rounded-sm shadow-sm transition-colors duration-200 text-sm tracking-wider">削除</button>
                    </div>
                `;
                listContainer.appendChild(row);
            });
            localStorage.setItem('mahjong_players', JSON.stringify(players));
        }

        // 過去データ画面のレンダリング
        function renderDataScreen() {
            for (let i = 1; i <= 4; i++) {
                const th = document.getElementById(`th-p${i}`);
                if (players[i - 1]) {
                    th.innerText = players[i - 1].name;
                } else {
                    th.innerText = `氏名${i}`;
                }
            }

            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            sampleScores.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-400";

                let html = `<td class="border-r border-gray-400 p-2 text-gray-600">${row.date}</td>`;
                
                row.scores.forEach(score => {
                    const isNegative = score.startsWith('-');
                    const colorClass = isNegative ? 'text-red-500' : 'text-gray-900';
                    html += `<td class="border-r border-gray-400 p-2 ${colorClass}">${score}</td>`;
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        // 日付対局者設定画面のレンダリング (新規追加)
        function renderInputScreen() {
            const container = document.getElementById('selectorPlayerList');
            container.innerHTML = '';

            // 画像の10マスデザインに合わせるため、登録プレイヤーが足りない場合は空のスロットを補う
            const displayCount = Math.max(players.length, 10);

            for (let i = 0; i < displayCount; i++) {
                const player = players[i];
                const playerName = player ? player.name : '対局者名';
                
                const item = document.createElement('div');
                item.className = 'flex items-center gap-3 text-gray-800';
                
                // 画像スタイル風のカスタムチェックボックス構造
                item.innerHTML = `
                    <input 
                        type="checkbox" 
                        id="check-p-${i}" 
                        ${player ? 'checked' : ''} 
                        class="w-5 h-5 accent-gray-500 rounded-sm cursor-pointer"
                    >
                    <label for="check-p-${i}" class="cursor-pointer tracking-wider text-sm select-none">${playerName}</label>
                `;
                container.appendChild(item);
            }
        }

        function handleInputOk() {
            alert('設定を保存しました。次の入力ステップ（スコア入力など）へ進みます（実装待ち）');
            showScreen('menu');
        }

        function addPlayer() {
            const newId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
            players.push({ id: newId, name: `プレイヤー${newId}` });
            renderPlayers();
        }

        function deletePlayer(id) {
            players = players.filter(player => player.id !== id);
            renderPlayers();
        }

        function updatePlayerName(id, newName) {
            const player = players.find(p => p.id === id);
            if (player) {
                player.name = newName;
                localStorage.setItem('mahjong_players', JSON.stringify(players));
            }
        }
    </script>
</body>
</html>
