<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀成績管理ツール</title>
    <!-- Tailwind CSSを読み込んでいます -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }
        .screen-hidden {
            display: none !important;
        }
        .table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="bg-white text-gray-900 min-h-screen m-0 p-0">

    <!-- ========================================== -->
    <!-- 1. モード選択画面（トップ画面） -->
    <!-- ========================================== -->
    <div id="menuScreen" class="w-full min-h-screen flex flex-col justify-between items-center py-16 px-4">
        <header class="w-full text-center max-w-md pt-8">
            <h1 class="text-xl font-bold tracking-wider text-gray-800">
                麻雀成績管理ツール
            </h1>
        </header>

        <main class="w-full max-w-xs flex flex-col gap-12 my-auto">
            <button onclick="showScreen('management')" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-4 px-6 rounded-sm shadow-sm transition-colors duration-200 tracking-widest text-center">
                管理
            </button>
            <button onclick="showScreen('data')" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-4 px-6 rounded-sm shadow-sm transition-colors duration-200 tracking-widest text-center">
                データ
            </button>
            <button onclick="showScreen('input')" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-4 px-6 rounded-sm shadow-sm transition-colors duration-200 tracking-widest text-center">
                入力
            </button>
        </main>

        <footer class="app-footer w-full text-center max-w-md text-sm text-gray-600 tracking-wide flex justify-center gap-4">
            <!-- JavaScriptから自動挿入 -->
        </footer>
    </div>

    <!-- ========================================== -->
    <!-- 2. 対局者管理画面 -->
    <!-- ========================================== -->
    <div id="managementScreen" class="screen-hidden">
        <div class="w-full max-w-md flex-grow">
            <header class="mb-10 text-center">
                <h2 class="text-xl font-bold tracking-wider text-gray-800">対局者管理画面</h2>
            </header>
            <div class="grid grid-cols-12 gap-2 mb-4 text-gray-700 font-medium max-w-xs mx-auto md:max-w-md">
                <div class="col-span-2 pl-2">ID</div>
                <div class="col-span-6">対局者名</div>
                <div class="col-span-4"></div>
            </div>
            <div id="playerList" class="flex flex-col gap-4 max-w-xs mx-auto md:max-w-md"></div>
        </div>
        <footer class="w-full max-w-md flex flex-col items-center gap-12 mt-auto">
            <div class="flex justify-between gap-8 w-full max-w-xs mx-auto md:max-w-md">
                <button onclick="addPlayer()" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">追加</button>
                <button onclick="showScreen('menu')" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">戻る</button>
            </div>
            <div class="app-footer text-center text-sm text-gray-600 tracking-wide flex justify-center gap-4">
                <!-- JavaScriptから自動挿入 -->
            </div>
        </footer>
    </div>

    <!-- ========================================== -->
    <!-- 3. 過去データ画面 -->
    <!-- ========================================== -->
    <div id="dataScreen" class="screen-hidden">
        <div class="w-full max-w-2xl flex-grow px-2">
            <div class="text-left w-full mb-4 pl-2 font-medium text-gray-800">2026年</div>
            <div class="table-container border border-gray-400 bg-white">
                <table class="w-full text-center border-collapse text-sm md:text-base">
                    <thead>
                        <tr class="border-b border-gray-400">
                            <th class="border-r border-gray-400 p-2 font-medium bg-gray-50 min-w-[100px]">対局者</th>
                            <th id="th-p1" class="border-r border-gray-400 p-2 font-medium min-w-[70px]">氏名1</th>
                            <th id="th-p2" class="border-r border-gray-400 p-2 font-medium min-w-[70px]">氏名2</th>
                            <th id="th-p3" class="border-r border-gray-400 p-2 font-medium min-w-[70px]">氏名3</th>
                            <th id="th-p4" class="border-gray-400 p-2 font-medium min-w-[70px]">氏名4</th>
                        </tr>
                        <tr class="border-b border-gray-400 bg-gray-50">
                            <td class="border-r border-gray-400 p-2 font-medium">成績</td>
                            <td class="border-r border-gray-400 p-2 font-bold text-red-500">-123</td>
                            <td class="border-r border-gray-400 p-2 font-bold text-gray-900">+57</td>
                            <td class="border-r border-gray-400 p-2 font-bold text-gray-900">+66</td>
                            <td class="p-2 font-bold text-gray-900">0</td>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody"></tbody>
                </table>
            </div>
        </div>
        <footer class="w-full max-w-md flex flex-col items-center gap-12 mt-12">
            <div class="flex justify-between gap-8 w-full max-w-xs mx-auto md:max-w-md">
                <button onclick="alert('期間選択機能は実装待ちです')" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">期間</button>
                <button onclick="showScreen('menu')" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">戻る</button>
            </div>
            <div class="app-footer text-center text-sm text-gray-600 tracking-wide flex justify-center gap-4">
                <!-- JavaScriptから自動挿入 -->
            </div>
        </footer>
    </div>

    <!-- ========================================== -->
    <!-- 4. 日付対局者設定画面 -->
    <!-- ========================================== -->
    <div id="inputScreen" class="screen-hidden">
        <div class="w-full max-w-md flex-grow">
            <header class="mb-8 text-center">
                <h2 class="text-xl font-bold tracking-wider text-gray-800">日付対局者設定画面</h2>
            </header>
            
            <div class="flex justify-center items-center gap-2 mb-8 max-w-xs mx-auto">
                <input type="date" id="datePicker" class="bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-sm shadow-sm focus:outline-none text-center">
            </div>

            <div class="max-w-xs mx-auto grid grid-cols-2 gap-y-4 gap-x-8 mb-12" id="selectorPlayerList">
                <!-- JavaScriptでチェックボックスの一覧を動的生成 -->
            </div>
        </div>
        <footer class="w-full max-w-md flex flex-col items-center gap-12 mt-auto">
            <div class="w-full max-w-xs mx-auto md:max-w-md text-right">
                <button onclick="showScreen('scoreView')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-8 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">OK</button>
            </div>
            <div class="app-footer text-center text-sm text-gray-600 tracking-wide flex justify-center gap-4">
                <!-- JavaScriptから自動挿入 -->
            </div>
        </footer>
    </div>

    <!-- ========================================== -->
    <!-- 5. 成績表示画面 -->
    <!-- ========================================== -->
    <div id="scoreViewScreen" class="screen-hidden">
        <div class="w-full max-w-md flex-grow">
            <div class="flex justify-between items-center mb-6 px-2">
                <span id="scoreViewDate" class="text-gray-800 font-medium">yyyy/mm/dd</span>
                <span class="bg-gray-300 text-gray-800 font-medium py-1 px-3 text-sm rounded-sm">日付対局者</span>
            </div>

            <div class="border border-gray-400 bg-white mb-8">
                <table class="w-full text-center border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-gray-400">
                            <th class="border-r border-gray-400 p-2 font-medium w-16 bg-gray-50"></th>
                            <th class="border-r border-gray-400 p-2 font-medium text-xs">対局者名</th>
                            <th class="border-r border-gray-400 p-2 font-medium text-xs">対局者名</th>
                            <th class="border-r border-gray-400 p-2 font-medium text-xs">対局者名</th>
                            <th class="p-2 font-medium text-xs">対局者名</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-gray-400">
                            <td class="border-r border-gray-400 p-2 font-medium bg-gray-50">1</td>
                            <td class="border-r border-gray-400 p-2 text-red-500 font-medium">-16</td>
                            <td class="border-r border-gray-400 p-2 text-gray-900 font-medium">+33</td>
                            <td class="border-r border-gray-400 p-2 text-red-500 font-medium">-10</td>
                            <td class="p-2 text-red-500 font-medium">-7</td>
                        </tr>
                        <tr class="border-b border-gray-400">
                            <td class="border-r border-gray-400 p-2 font-medium bg-gray-50">2</td>
                            <td class="border-r border-gray-400 p-2 text-gray-900 font-medium relative pb-5">+45<span class="absolute bottom-0.5 right-1 text-[10px] text-gray-500 font-normal">飛</span></td>
                            <td class="border-r border-gray-400 p-2 text-red-500 font-medium relative pb-5">-34<span class="absolute bottom-0.5 left-1 text-[10px] text-red-500 font-normal">鳥</span><span class="absolute bottom-0.5 right-1 text-[10px] text-gray-500 font-normal">飛</span></td>
                            <td class="border-r border-gray-400 p-2 text-red-500 font-medium">-22</td>
                            <td class="p-2 text-gray-900 font-medium">+11</td>
                        </tr>
                        <tr class="border-b border-gray-400">
                            <td class="border-r border-gray-400 p-2 font-medium bg-gray-50">3</td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="p-2"></td>
                        </tr>
                        <tr class="border-b border-gray-400">
                            <td class="border-r border-gray-400 p-2 font-medium bg-gray-50">4</td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="p-2"></td>
                        </tr>
                        <tr class="border-b border-gray-400">
                            <td class="border-r border-gray-400 p-2 font-medium bg-gray-50 text-xs">チップ</td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="p-2"></td>
                        </tr>
                        <tr>
                            <td class="border-r border-gray-400 p-2 font-medium bg-gray-50 text-xs">成績</td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="border-r border-gray-400 p-2"></td>
                            <td class="p-2"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <footer class="w-full max-w-md flex flex-col items-center gap-12 mt-auto">
            <div class="grid grid-cols-4 gap-2 w-full px-2">
                <button onclick="alert('チップ入力は実装待ちです')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 text-sm rounded-sm shadow-sm transition-colors duration-200 text-center">チップ</button>
                <button onclick="alert('入力機能は実装待ちです')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 text-sm rounded-sm shadow-sm transition-colors duration-200 text-center">入力</button>
                <button onclick="alert('集計機能は実装待ちです')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 text-sm rounded-sm shadow-sm transition-colors duration-200 text-center">集計</button>
                <button onclick="showScreen('menu')" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 text-sm rounded-sm shadow-sm transition-colors duration-200 text-center">終了</button>
            </div>
            <div class="app-footer text-center text-sm text-gray-600 tracking-wide flex justify-center gap-4">
                <!-- JavaScriptから自動挿入 -->
            </div>
        </footer>
    </div>

    <!-- ========================================== -->
    <!-- ロジック制御（JavaScript） -->
    <!-- ========================================== -->
    <script>
        // バージョンと日付の一括管理設定
        const APP_VERSION = 'ver0.0.15';
        const APP_UPDATE_DATE = '2026/11/09';

        // フッターの一括変数設定システム
        function initializeFooters() {
            const footers = document.querySelectorAll('.app-footer');
            footers.forEach(footer => {
                footer.innerHTML = `<span>${APP_UPDATE_DATE}</span><span>${APP_VERSION}</span>`;
            });
        }

        const defaultPlayers = [
            { id: 1, name: 'プレイヤー1' },
            { id: 2, name: 'プレイヤー2' },
            { id: 3, name: 'プレイヤー3' },
            { id: 4, name: 'プレイヤー4' }
        ];

        let players = JSON.parse(localStorage.getItem('mahjong_players')) || defaultPlayers;

        function showScreen(screenName) {
            const screens = ['menuScreen', 'managementScreen', 'dataScreen', 'inputScreen', 'scoreViewScreen'];
            screens.forEach(id => {
                document.getElementById(id).className = "screen-hidden";
            });

            if (screenName === 'management') {
                document.getElementById('managementScreen').className = "w-full min-h-screen flex flex-col justify-between items-center py-16 px-4";
                renderPlayers();
            } else if (screenName === 'menu') {
                document.getElementById('menuScreen').className = "w-full min-h-screen flex flex-col justify-between items-center py-16 px-4";
            } else if (screenName === 'data') {
                document.getElementById('dataScreen').className = "w-full min-h-screen flex flex-col justify-between items-center py-16 px-4";
                renderDataScreen();
            } else if (screenName === 'input') {
                document.getElementById('inputScreen').className = "w-full min-h-screen flex flex-col justify-between items-center py-16 px-4";
                renderSelectorPlayers();
            } else if (screenName === 'scoreView') {
                document.getElementById('scoreViewScreen').className = "w-full min-h-screen flex flex-col justify-between items-center py-16 px-4";
                document.getElementById('scoreViewDate').innerText = document.getElementById('datePicker').value.replace(/-/g, '/');
            }
            window.scrollTo(0, 0);
        }

        function renderPlayers() {
            const listContainer = document.getElementById('playerList');
            listContainer.innerHTML = '';
            players.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-12 gap-2 items-center';
                row.innerHTML = `
                    <div class="col-span-2 pl-2 text-gray-700 font-medium">${index + 1}</div>
                    <div class="col-span-6">
                        <input type="text" value="${player.name}" onchange="updatePlayerName(${player.id}, this.value)" class="w-full bg-green-50 border border-transparent focus:border-green-300 focus:bg-white focus:outline-none px-3 py-2 text-gray-800 rounded-sm">
                    </div>
                    <div class="col-span-4 text-right">
                        <button onclick="deletePlayer(${player.id})" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-4 rounded-sm shadow-sm transition-colors duration-200 text-sm tracking-wider">削除</button>
                    </div>
                `;
                listContainer.appendChild(row);
            });
            localStorage.setItem('mahjong_players', JSON.stringify(players));
        }

        function renderSelectorPlayers() {
            const container = document.getElementById('selectorPlayerList');
            container.innerHTML = '';
            // 最大10枠分のチェックボックスを生成
            for (let i = 0; i < 10; i++) {
                const p = players[i];
                const name = p ? p.name : '';
                const item = document.createElement('div');
                item.className = 'flex items-center gap-2 text-gray-800';
                item.innerHTML = `
                    <input type="checkbox" ${p ? 'checked' : ''} class="w-4 h-4 rounded-sm border-gray-400 text-indigo-600 focus:ring-indigo-500">
                    <span class="text-sm truncate">${name || '---'}</span>
                `;
                container.appendChild(item);
            }
        }

        function renderDataScreen() {
            for (let i = 1; i <= 4; i++) {
                const th = document.getElementById(`th-p${i}`);
                if (players[i - 1]) th.innerText = players[i - 1].name;
            }
        }

        function addPlayer() {
            const newId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
            players.push({ id: newId, name: `プレイヤー${newId}` });
            renderPlayers();
        }

        function deletePlayer(id) {
            players = players.filter(player => player.id !== id);
            renderPlayers();
        }

        function updatePlayerName(id, newName) {
            const player = players.find(p => p.id === id);
            if (player) {
                player.name = newName;
                localStorage.setItem('mahjong_players', JSON.stringify(players));
            }
        }

        // 初期化処理
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('datePicker').value = today;
        initializeFooters();
    </script>
</body>
</html>
