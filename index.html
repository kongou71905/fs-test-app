<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡単おみくじアプリ</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f9f9f9; }
        button { font-size: 18px; padding: 10px 20px; cursor: pointer; background-color: #ff4757; color: white; border: none; border-radius: 5px; }
        #result { font-size: 32px; font-weight: bold; margin-top: 30px; color: #ff4757; }
    </style>
</head>
<body>
    <h1>今日のおみくじ</h1>
    <button onclick="drawOmikuji()">おみくじを引く</button>
    <div id="result">?</div>

    <script>
        function drawOmikuji() {
            const fortunes = ["大吉 🌟", "吉 👍", "中吉 😊", "小吉 🙂", "凶 😢"];
            const random = Math.floor(Math.random() * fortunes.length);
            document.getElementById("result").innerText = fortunes[random];
        }
    </script>
</body>
</html>
