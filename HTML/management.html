<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>対局者管理 - 麻雀成績管理ツール</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between items-center py-16 px-4">
    <div class="w-full max-w-md flex-grow">
        <header class="mb-10 text-center">
            <h2 class="text-xl font-bold tracking-wider text-gray-800">対局者管理画面</h2>
        </header>
        <div class="grid grid-cols-12 gap-2 mb-4 text-gray-700 font-medium max-w-xs mx-auto md:max-w-md">
            <div class="col-span-2 pl-2">ID</div>
            <div class="col-span-6">対局者名</div>
            <div class="col-span-4"></div>
        </div>
        <div id="playerList" class="flex flex-col gap-4 max-w-xs mx-auto md:max-w-md"></div>
    </div>

    <footer class="w-full max-w-md flex flex-col items-center gap-12 mt-auto">
        <div class="flex justify-between gap-8 w-full max-w-xs mx-auto md:max-w-md">
            <button onclick="addPlayer()" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">追加</button>
            <a href="../index.html" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest block">戻る</a>
        </div>
        <div class="app-footer text-center text-sm text-gray-600 tracking-wide flex justify-center gap-4"></div>
    </footer>

    <script src="../JavaScript/common.js"></script>
    <script>
        let players = getPlayers();

        function renderPlayers() {
            const listContainer = document.getElementById('playerList');
            listContainer.innerHTML = '';

            players.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'grid grid-cols-12 gap-2 items-center';
                row.innerHTML = `
                    <div class="col-span-2 pl-2 text-gray-700 font-medium">${index + 1}</div>
                    <div class="col-span-6">
                        <input type="text" value="${player.name}" onchange="updatePlayerName(${player.id}, this.value)" class="w-full bg-green-50 border border-transparent focus:border-green-300 focus:bg-white focus:outline-none px-3 py-2 text-gray-800 rounded-sm" placeholder="名前を入力">
                    </div>
                    <div class="col-span-4 text-right">
                        <button onclick="deletePlayer(${player.id})" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-4 rounded-sm shadow-sm transition-colors duration-200 text-sm tracking-wider">削除</button>
                    </div>
                `;
                listContainer.appendChild(row);
            });
            savePlayers(players);
        }

        function addPlayer() {
            const newId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
            players.push({ id: newId, name: `プレイヤー${newId}` });
            renderPlayers();
        }

        function deletePlayer(id) {
            players = players.filter(player => player.id !== id);
            renderPlayers();
        }

        function updatePlayerName(id, newName) {
            const player = players.find(p => p.id === id);
            if (player) {
                player.name = newName;
                savePlayers(players);
            }
        }

        renderPlayers();
    </script>
</body>
</html>
