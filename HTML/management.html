<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>対局者管理 - 麻雀成績管理ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between items-center py-16 px-4">
    <div class="w-full max-w-md flex-grow">
        <header class="mb-10 text-center">
            <h2 class="text-xl font-bold tracking-wider text-gray-800">対局者管理画面</h2>
        </header>

        <!-- テーブルヘッダー（横1列レイアウト） -->
        <div class="flex items-center gap-3 mb-4 text-gray-700 font-medium w-full max-w-sm mx-auto">
            <div class="w-8 text-center shrink-0">ID</div>
            <div class="flex-1">対局者名</div>
            <div class="w-16 shrink-0"></div>
        </div>

        <!-- 対局者リスト（1人ごとに横1列で表示） -->
        <div id="playerList" class="flex flex-col gap-4 w-full max-w-sm mx-auto"></div>
    </div>

    <footer class="w-full max-w-md flex flex-col items-center gap-12 mt-12">
        <div class="flex justify-between gap-8 w-full max-w-sm mx-auto">
            <button onclick="addPlayer()" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">
                追加
            </button>
            <button onclick="location.href='../index.html'" class="w-1/2 bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-sm shadow-sm transition-colors duration-200 text-center tracking-widest">
                戻る
            </button>
        </div>
        <div class="app-footer text-center text-sm text-gray-600 tracking-wide flex justify-center gap-4"></div>
    </footer>

    <script src="../JavaScript/common.js"></script>
    <script>
        let players = getPlayers();

        function renderPlayers() {
            const listContainer = document.getElementById('playerList');
            listContainer.innerHTML = '';

            players.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-3 w-full';
                row.innerHTML = `
                    <div class="w-8 text-center text-gray-700 font-medium shrink-0">${index + 1}</div>
                    <div class="flex-1 min-w-0">
                        <input 
                            type="text" 
                            value="${player.name}" 
                            onchange="updatePlayerName(${player.id}, this.value)"
                            class="w-full bg-green-50 border border-transparent focus:border-green-300 focus:bg-white focus:outline-none px-3 py-2 text-gray-800 rounded-sm"
                            placeholder="名前を入力"
                        >
                    </div>
                    <div class="shrink-0">
                        <button onclick="deletePlayer(${player.id})" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-2 px-4 rounded-sm shadow-sm transition-colors duration-200 text-sm tracking-wider whitespace-nowrap">
                            削除
                        </button>
                    </div>
                `;
                listContainer.appendChild(row);
            });
            savePlayers(players);
        }

        function addPlayer() {
            const newId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
            players.push({ id: newId, name: `プレイヤー${newId}` });
            renderPlayers();
        }

        function deletePlayer(id) {
            players = players.filter(player => player.id !== id);
            renderPlayers();
        }

        function updatePlayerName(id, newName) {
            const player = players.find(p => p.id === id);
            if (player) {
                player.name = newName;
                savePlayers(players);
            }
        }

        renderPlayers();
    </script>
</body>
</html>
